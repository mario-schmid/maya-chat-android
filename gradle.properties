# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX libraries use the androidx. namespace instead of the old android.support. namespace.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true
# https://github.com/gradle/gradle/issues/13461
# It creates issue with detekt
org.gradle.configuration-cache.problems=warn

# Kotlin
kotlin.code.style=official
# Enable parallel compilation
kotlin.incremental=true

# This flag is used to enable the enterprise build.
# This can be overridden by the CI or in your local.properties file.
# element.enterprise=true

# Use the latest version of the Android Gradle Plugin.
android.suppressUnknownCompileSdk=36

# Enable new DSL features.
android.newDsl=true

# Gradual R8 support for optimization.enable=true
android.r8.gradual.support=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
